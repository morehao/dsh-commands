name: check

# 最小 CI：不构建、不装依赖，用离线冒烟代替真实安装。
# 目标是把「只有真正发版时才会暴露」的机械错误前移到 PR —— 发布是 tag 触发、tag 推上去就不可改，
# 失败只能事后发现（v0.1.6 就是实例：tag 已推、run 失败，只能补发）。
on:
  pull_request:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    name: Pre-publish checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 发布脚本语法
        run: bash -n scripts/ci-publish.sh

      - name: 插件语法
        run: |
          node --check lib/index.js
          node --check lib/skill-setup.js
          node --check lib/skill-cache.js
          node --check lib/skill-paths.js
          node --check lib/text.js
          node --check lib/proc.js
          node --check lib/job-progress.js
          node --check lib/confirm.js
          node --check lib/client.js
          node --check scripts/smoke-skill-setup.mjs
          node --check scripts/smoke-skill-cache.mjs
          node --check scripts/smoke-client-bundle.mjs

      # Release body 由 CI 从注记 tag 投影（见 release.yml），取正文必须与 git-kit 的读回管道逐字一致。
      - name: 发布说明投影（Release body）
        run: |
          node --check scripts/release-notes.mjs
          node scripts/smoke-release-notes.mjs

      - name: 三处命名一致（包名 / 模块标识符 / 插件名）
        run: node scripts/check-naming.mjs

      - name: 打包内容白名单
        run: node scripts/check-pack.mjs

      # Client half 接线：加载 bundle，确认命令卡 / 完成提示 / 未读点注册到约定槽。
      - name: Client bundle 冒烟
        run: node scripts/smoke-client-bundle.mjs

      # 技能自举（/skill-init、/skill-update）：用 stub 顶替 npx skills，不联网、不碰真实 home。
      - name: 技能自举冒烟
        run: node scripts/smoke-skill-setup.mjs

      - name: 技能缓存冒烟
        run: node scripts/smoke-skill-cache.mjs
