name: check

# 最小 CI：不构建、不装依赖，用离线冒烟代替真实安装。
# 目标是把「只有真正发版时才会暴露」的机械错误前移到 PR —— 发布是 tag 触发、tag 推上去就不可改，
# 失败只能事后发现（v0.1.6 就是实例：tag 已推、run 失败，只能补发）。
on:
  pull_request:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    name: Pre-publish checks
    # 镜像显式钉版本：ubuntu-latest 自 2026-10-19 起分批迁到 26.04（11-19 完成）。
    # 校验结果不该随镜像漂移，跟随已验证的 24.04；要试新镜像就改成 ubuntu-26.04 单独跑一轮。
    runs-on: ubuntu-24.04
    permissions:
      contents: read   # 只读校验，不写仓库
    steps:
      - name: Checkout
        uses: actions/checkout@v7   # v5 起跑在 node24 上（v4 会触发 node20 弃用警告）

      - name: Setup Node.js
        uses: actions/setup-node@v7   # 同上，避免被强制从 node20 迁移
        with:
          node-version: '22'
          # 本包零 runtime 依赖、CI 不装依赖：显式关掉 setup-node 的自动依赖缓存
          # （v6 起只要 package.json 有 packageManager 字段就会自动开缓存，别靠字段缺席保平安）。
          package-manager-cache: false

      - name: 发布脚本语法
        run: bash -n scripts/ci-publish.sh

      # 语法自检：扫 lib/ 与 scripts/ 全量 + locale JSON。原先在这里逐个列文件名，
      # 新增 lib/*.js 忘了补一行就静默漏检。
      - name: 插件语法
        run: npm run check:syntax

      # Release body 由 CI 从注记 tag 投影（见 release.yml），取正文必须与 git-kit 的读回管道逐字一致。
      - name: 发布说明投影（Release body）
        run: npm run check:release-notes

      - name: 三处命名一致（包名 / 模块标识符 / 插件名）
        run: npm run check:naming

      - name: 打包内容白名单
        run: npm run check:pack

      # 全部离线冒烟的唯一入口（等价 npm test）：技能自举（stub 顶替 skills CLI）+ 工具/命令层
      # + 技能缓存（本地 git）+ 契约校验（临时 HOME）。CI 与本地跑的是同一串脚本，不各列一份。
      - name: 冒烟（npm test）
        run: npm test
